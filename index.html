<title>Le Studio de l’IA</title>

<script>
/* =====================================================================
   CONFIG : LA PARTIE À MODIFIER
   ---------------------------------------------------------------------
   Vous pouvez changer ici les questions, les durées, les couleurs et
   les textes, sans toucher au reste du fichier.
   Règles d’écriture :
   - chaque texte est entre guillemets "…" ;
   - chaque ligne se termine par une virgule ;
   - « bonne » indique la bonne réponse : 1 = la 1re de la liste,
     2 = la 2e, etc. Le jeu mélange ensuite l’ordre des réponses.
   - « effet » dit ce qui apparaît dans le studio après la question
     (lumieres, persona, appel, sujet, decor, ambiance, cadrage, orbite).
   ===================================================================== */
const CONFIG = {

  /* ---------- 1. LES 8 ÉTAPES (une question chacune) ---------- */
  questions: [
    {
      theme: "publication", etape: "Le Skill",
      question: "Un Skill (une compétence), c’est…",
      reponses: ["Une méthode que l’IA réutilise", "Un nouveau réseau social", "Une IA qui publie toute seule", "Un abonnement obligatoire"],
      bonne: 1,
      brief: "Skill « Expert publications »",
      effet: "lumieres", annonceScene: "Le studio s’allume !",
      explication: "On définit une fois la mission, le ton et les règles. L’IA les réapplique à chaque nouvelle demande, sans tout réexpliquer."
    },
    {
      theme: "publication", etape: "La cible",
      question: "« Élodie, 34 ans, fan d’artisanat local » : c’est…",
      reponses: ["Un persona : ma cliente idéale", "Une influenceuse à payer", "Une IA concurrente", "Ma comptable"],
      bonne: 1,
      brief: "Cible : Élodie, 34 ans",
      effet: "persona", annonceScene: "Élodie rejoint le tableau",
      explication: "Le persona est le portrait de votre client idéal. Avec lui, l’IA sait à qui elle parle et choisit les bons mots."
    },
    {
      theme: "publication", etape: "L’appel à l’action",
      question: "Pour finir ma publication, j’ajoute…",
      reponses: ["« Venez la découvrir à l’atelier ! »", "30 hashtags au hasard", "Un faux avis client", "Un prix inventé par l’IA"],
      bonne: 1,
      brief: "« Venez la découvrir à l’atelier ! »",
      effet: "appel", annonceScene: "L’appel à l’action est au tableau",
      explication: "C’est un appel à l’action : il dit au lecteur quoi faire ensuite (venir, réserver, appeler…). Et jamais de faux avis ni de prix inventé !"
    },
    {
      theme: "image", etape: "Le sujet",
      question: "Quel sujet principal est le plus précis ?",
      reponses: ["Une bougie en cire de soja, pot ambré", "Un bel objet", "Un produit artisanal", "Une bougie, un vase et un savon"],
      bonne: 1,
      brief: "Bougie en cire de soja, pot ambré",
      effet: "sujet", annonceScene: "La bougie entre en scène",
      explication: "Plus le sujet est précis (matière, forme, couleur), plus l’image ressemble à votre produit. Un seul sujet principal à la fois !"
    },
    {
      theme: "image", etape: "Le décor",
      question: "Quelle phrase décrit le décor ?",
      reponses: ["Posée sur une table en bois clair", "Lumière naturelle douce", "Gros plan, vue de 3/4", "En cire de soja"],
      bonne: 1,
      brief: "posée sur une table en bois clair",
      effet: "decor", annonceScene: "Le décor est posé",
      explication: "Le décor, c’est où se trouve le sujet : la surface, l’arrière-plan. « Lumière douce » décrit l’ambiance, « vue de 3/4 » le cadrage."
    },
    {
      theme: "image", etape: "L’ambiance",
      question: "Pour l’ambiance, j’écris plutôt…",
      reponses: ["Lumière douce, ambiance cosy", "Fais-la belle", "Très haute qualité svp", "Comme d’habitude"],
      bonne: 1,
      brief: "lumière naturelle douce, ambiance cosy",
      effet: "ambiance", annonceScene: "Flamme allumée, lumière douce",
      explication: "« Fais-la belle » ne dit rien à l’IA. Décrivez la lumière et l’ambiance voulues : douce, chaleureuse, lumineuse…"
    },
    {
      theme: "image", etape: "Le cadrage",
      question: "Pour montrer les détails de la bougie de près, j’écris…",
      reponses: ["Gros plan, vue de 3/4", "Plan large, vu de loin", "Une photo vraiment réussie", "Lumière naturelle douce"],
      bonne: 1,
      brief: "gros plan, vue de 3/4 avant",
      effet: "cadrage", annonceScene: "Clic ! La photo est prise",
      explication: "Le cadrage dit comment l’image est composée. Pour montrer les détails, on s’approche : gros plan. Le plan large montre tout de loin, et « lumière douce » décrit l’ambiance."
    },
    {
      theme: "video", etape: "Le mouvement",
      question: "Pour filmer en tournant autour de la bougie, je demande…",
      reponses: ["Un plan orbital", "Un zoom arrière", "Une photo floue", "Un fond vert"],
      bonne: 1,
      brief: "Vidéo : plan orbital à 360°",
      effet: "orbite", annonceScene: "Action ! Plan orbital",
      explication: "Le plan orbital fait le tour du produit pour le montrer sous tous ses angles. On voit la vidéo en détail cet après-midi !"
    }
  ],

  /* ---------- 2. LE TEMPS ---------- */
  tempsReponse: 25,   // secondes pour répondre (0 = pas de limite). À la fin du temps, la réponse sélectionnée est validée.
  alerteFin: 5,       // dernières secondes : la barre passe en ambre et le chrono fait tic-tac

  /* ---------- 3. LES DURÉES (en secondes) ---------- */
  durees: {
    suspense: 0.7,        // après « Valider », avant de révéler la bonne réponse
    reponse: 1.6,         // affichage « Bien vu ! » ou « Presque ! »
    explicationMin: 1.2,  // délai avant de pouvoir fermer l’explication
    construction: 2.6,    // apparition d’un élément dans le studio
    cadrage: 4.4,         // séquence photo (zoom, viseur, flash)
    orbite: 6.0,          // séquence vidéo (tour complet de la bougie)
    fonduFin: 0.8
  },

  explicationSiBonneReponse: false, // false = on enchaîne directement après une bonne réponse
  volume: 0.4,

  /* ---------- 4. LES COULEURS DE LA CHARTE ---------- */
  couleurs: {
    bleuPastel: "#C4DFFF",
    creme:      "#FFF3DF",
    vert:       "#78AF59",
    sable:      "#C69B70",
    bleu:       "#2763B6",
    ambre:      "#F3A33B",
    menthe:     "#61C8B0",
    prune:      "#AD5195",
    encre:      "#202744",
    rouge:      "#BF3A46",
    peau:       "#AE7445",
    cheveux:    "#523721",
    rocher:     "#777C86",
    soleil:     "#FFE0AF"
  },

  /* ---------- 5. LES TEXTES DES ÉCRANS ---------- */
  textes: {
    journee: "Journée 2",
    titreLigne1: "Le Studio",
    titreLigne2: "de l’IA",
    accueilAccroche: "8 étapes pour créer la publication, la photo et la vidéo d’une bougie artisanale.",
    accueilGroupe: "À chaque bonne réponse, le studio se monte sous vos yeux. Le groupe peut aider à voix haute !",
    boutonJouer: "Jouer",
    aideChoisir: "choisir une réponse",
    aideValider: "valider",
    aideTactileChoisir: "Touchez une réponse",
    aideTactileValider: "puis « Valider »",
    etape: "Étape",
    score: "Score",
    briefTitre: "Le brief de l’IA",
    themes: { publication: "La publication", image: "L’image", video: "La vidéo · avant-goût" },
    boutonValider: "Valider",
    bravo: ["Bien vu !", "Exact !", "Bravo !", "Parfait !"],
    bravoSousTitre: "+1 point",
    rate: ["Presque !", "Pas tout à fait…", "Bien tenté !"],
    rateSousTitre: "Voici la bonne réponse",
    tempsEcoule: "Temps écoulé !",
    etiquetteBonne: "Bonne réponse",
    etiquetteChoisie: "Votre choix",
    pasDeReponse: "Pas de réponse",
    saviezVous: "Le saviez-vous ?",
    boutonContinuer: "Continuer",
    finTitre: "C’est dans la boîte !",
    finTiers: [
      { min: 0, message: "Bon début ! Avec un brief précis, l’IA fait des merveilles : on s’entraîne cet après-midi." },
      { min: 4, message: "Beau travail ! Vous savez déjà guider l’IA vers un contenu qui vous ressemble." },
      { min: 7, message: "Pros du prompt ! Votre studio est prêt pour la vidéo de cet après-midi." }
    ],
    finPrompt: "Le prompt de la photo",
    messageCle: "Objectif clair + prompt précis + votre ton = un contenu qui vous ressemble !",
    boutonRejouer: "Rejouer",
    postNom: "Mon atelier",
    postSousTitre: "Publication · brouillon",
    postLegende: "Notre bougie en cire de soja, coulée à la main dans son pot ambré. Une lumière douce pour vos soirées cosy. Venez la découvrir à l’atelier !",
    pause: "Pause",
    boutonReprendre: "Reprendre"
  }
};
/* ===================== FIN DE LA PARTIE À MODIFIER ===================== */
</script>

<style>
:root {
  --bleu-pastel: #C4DFFF; --creme: #FFF3DF; --vert: #78AF59; --sable: #C69B70;
  --bleu: #2763B6; --ambre: #F3A33B; --menthe: #61C8B0; --prune: #AD5195;
  --encre: #202744; --rouge: #BF3A46;
  --titre: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --texte: "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --ombre: 0 10px 28px rgba(32, 39, 68, .18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; background: #3A3F55;
  font-family: var(--texte); color: var(--encre);
  -webkit-user-select: none; user-select: none; touch-action: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; }
#ui button { pointer-events: auto; font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.cache { display: none !important; }
.lecteur { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Pastilles ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 24px;
  border-radius: 999px; background: var(--creme); box-shadow: var(--ombre);
  font: 900 26px/1 var(--texte); white-space: nowrap;
}
#hud { position: absolute; inset: 0; transition: opacity .4s; }
#hud.masque { opacity: 0; visibility: hidden; }
#hud-gauche { position: absolute; left: 24px; top: 24px; display: flex; gap: 12px; }
#coin { position: absolute; right: 24px; top: 24px; display: flex; gap: 12px; }
.rond { width: 56px; height: 56px; border-radius: 50%; background: var(--creme) !important; box-shadow: var(--ombre); display: grid; place-items: center; }
.rond svg { width: 28px; height: 28px; }
.rond:hover { transform: scale(1.06); }

/* ---------- Bandeau question ---------- */
#bandeau { position: absolute; top: 24px; left: 500px; width: 1150px; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: opacity .35s; }
#theme { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border-radius: 999px; color: #fff; font: 700 26px/1 var(--titre); box-shadow: var(--ombre); }
#theme svg { width: 26px; height: 26px; }
#theme.publication { background: var(--bleu); }
#theme.image { background: var(--prune); }
#theme.video { background: var(--encre); }
#bandeau-carte {
  width: 100%; min-height: 96px; padding: 16px 40px; border-radius: 24px;
  background: rgba(255, 243, 223, .97); box-shadow: var(--ombre);
  display: flex; align-items: center; justify-content: center; text-align: center;
  font: 700 50px/1.1 var(--titre); letter-spacing: -.01em;
}
#progression { width: 100%; height: 12px; border-radius: 6px; background: rgba(32, 39, 68, .18); overflow: hidden; }
#progression-barre { width: 100%; height: 100%; border-radius: 6px; background: var(--bleu); transform-origin: left center; transition: background-color .3s; }
#progression.urgent #progression-barre { background: var(--ambre); }
#progression.sans-limite { visibility: hidden; }

/* ---------- Brief (colonne de gauche) ---------- */
#brief { position: absolute; left: 24px; top: 104px; width: 450px; padding: 16px 20px 12px; border-radius: 24px; background: rgba(255, 243, 223, .95); box-shadow: var(--ombre); transition: opacity .35s, transform .35s; }
#brief-titre { font: 700 32px/1 var(--titre); margin-bottom: 6px; }
.brief-groupe { margin-top: 10px; font: 900 18px/1 var(--texte); text-transform: uppercase; letter-spacing: .06em; opacity: .62; }
.case { display: flex; align-items: center; gap: 10px; margin-top: 4px; padding: 4px 8px; border-radius: 12px; border: 3px solid transparent; transition: background-color .3s, border-color .3s; }
.case .num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(32, 39, 68, .1); font: 900 18px/1 var(--texte); }
.case .contenu { min-width: 0; }
.case .lib { font: 900 19px/1.15 var(--texte); }
.case .val { font: 800 18px/1.2 var(--texte); color: rgba(32, 39, 68, .45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.case.encours { border-color: var(--bleu); background: rgba(39, 99, 182, .08); }
.case.ok .num { background: var(--vert); }
.case.ko .num { background: var(--rouge); color: #fff; }
.case.remplie .val { color: var(--encre); }
.case.flash { animation: flash-case .9s ease-out; }
@keyframes flash-case { 0% { background: rgba(243, 163, 59, .7); } 100% { background: transparent; } }
#etapes { position: absolute; display: none; gap: 10px; justify-content: center; }
.etape-point { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 243, 223, .9); box-shadow: var(--ombre); font: 900 24px/1 var(--texte); border: 4px solid transparent; }
.etape-point.encours { border-color: var(--bleu); }
.etape-point.ok { background: var(--vert); }
.etape-point.ko { background: var(--rouge); color: #fff; }

/* ---------- Cartes réponses ---------- */
#cartes { position: absolute; left: 80px; bottom: 24px; width: 1760px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; transition: opacity .35s, transform .35s; }
.carte {
  position: relative; display: block; text-align: center; border-radius: 20px !important;
  background: var(--creme) !important; box-shadow: var(--ombre);
  outline: 6px solid transparent; transition: transform .2s, opacity .3s, outline-color .2s;
}
.carte-tete { height: 56px; border-radius: 20px 20px 0 0; display: flex; align-items: center; justify-content: center; gap: 14px; font: 700 40px/1 var(--titre); transition: background-color .2s; }
.carte-corps { min-height: 95px; padding: 12px 16px 14px; display: flex; align-items: center; justify-content: center; font: 900 30px/1.15 var(--texte); }
.carte .badge {
  position: absolute; top: -40px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  padding: 5px 14px; border-radius: 999px; background: var(--encre); color: var(--creme);
  font: 900 20px/1.2 var(--texte); opacity: 0; transition: opacity .2s;
}
.carte.actuelle { transform: translateY(-10px); outline-color: var(--c); }
.carte.actuelle .badge { opacity: 1; }
.carte.validee { animation: suspense .35s ease-in-out infinite alternate; }
@keyframes suspense { from { transform: translateY(-10px) scale(1); } to { transform: translateY(-10px) scale(1.03); } }
.carte.bonne { outline-color: var(--vert); transform: translateY(-10px); animation: none; }
.carte.bonne .carte-tete { background: var(--vert) !important; color: var(--encre) !important; }
.carte.bonne .carte-tete svg { fill: var(--encre) !important; }
.carte.bonne .badge { opacity: 1; background: var(--vert); color: var(--encre); }
.carte.choisie { outline-color: var(--rouge); animation: none; }
.carte.choisie .carte-tete { background: var(--rouge) !important; color: #fff !important; }
.carte.choisie .carte-tete svg { fill: #fff !important; }
.carte.choisie .badge { opacity: 1; background: var(--rouge); color: #fff; }
.carte.estompee { opacity: .45; }
#btn-valider { position: absolute; left: 50%; bottom: 214px; transform: translateX(-50%); min-width: 320px; height: 88px; font-size: 40px !important; transition: transform .15s, opacity .3s; }
#btn-valider:hover:not(:disabled) { transform: translateX(-50%) scale(1.05); }
#btn-valider.invisible { opacity: 0; pointer-events: none !important; }
#hud.cinema #cartes, #hud.cinema #brief, #hud.cinema #bandeau, #hud.cinema #btn-valider, #hud.cinema #etapes { opacity: 0; pointer-events: none; }
#hud.cinema #cartes { transform: translateY(40px); }
#hud.cinema #brief { transform: translateX(-40px); }

/* ---------- Retours ---------- */
#retour { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; }
#retour.visible { opacity: 1; }
#retour-titre { padding: 10px 36px; border-radius: 24px; background: var(--creme); box-shadow: var(--ombre); font: 700 64px/1.1 var(--titre); text-shadow: 0 4px 0 rgba(243, 163, 59, .55); }
#retour-sous { padding: 8px 22px; border-radius: 999px; font: 900 30px/1.2 var(--texte); }
#retour.ok #retour-sous { background: var(--vert); color: var(--encre); }
#retour.ko #retour-sous { background: var(--creme); color: var(--encre); box-shadow: var(--ombre); }
#annonce-scene { position: absolute; left: 50%; top: 268px; transform: translate(-50%, -10px); display: inline-flex; align-items: center; gap: 12px; padding: 12px 30px; border-radius: 999px; background: var(--ambre); color: var(--encre); box-shadow: var(--ombre); font: 700 40px/1.1 var(--titre); white-space: nowrap; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; }
#annonce-scene.visible { opacity: 1; transform: translate(-50%, 0); }
#annonce-scene svg { width: 34px; height: 34px; }

/* Viseur photo / vidéo et flash */
#viseur { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; }
#viseur.visible { opacity: 1; }
#viseur .coin-v { position: absolute; width: 9vmin; height: 9vmin; border: 0 solid rgba(255, 255, 255, .95); filter: drop-shadow(0 0 4px rgba(0, 0, 0, .35)); }
#viseur .hg { left: 6vmin; top: 6vmin; border-left-width: .9vmin; border-top-width: .9vmin; }
#viseur .hd { right: 6vmin; top: 6vmin; border-right-width: .9vmin; border-top-width: .9vmin; }
#viseur .bg { left: 6vmin; bottom: 6vmin; border-left-width: .9vmin; border-bottom-width: .9vmin; }
#viseur .bd { right: 6vmin; bottom: 6vmin; border-right-width: .9vmin; border-bottom-width: .9vmin; }
#viseur .mire { position: absolute; left: 50%; top: 50%; width: 7vmin; height: 7vmin; transform: translate(-50%, -50%); border: .45vmin solid rgba(255, 255, 255, .85); border-radius: 50%; }
#viseur .etiquette-v { position: absolute; left: 9vmin; top: 9vmin; display: flex; align-items: center; gap: 1.4vmin; color: #fff; font: 700 4vmin/1 var(--titre); text-shadow: 0 0 6px rgba(0, 0, 0, .5); }
#viseur .point-rec { width: 3vmin; height: 3vmin; border-radius: 50%; background: var(--rouge); box-shadow: 0 0 0 .5vmin rgba(255, 255, 255, .8); }
#viseur.video .point-rec { animation: rec 1s steps(2) infinite; }
@keyframes rec { 50% { opacity: .15; } }
#viseur:not(.video) .point-rec { background: #fff; box-shadow: none; }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

/* ---------- Écrans ---------- */
.ecran { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .4s, visibility .4s; }
.ecran.visible { opacity: 1; visibility: visible; }
.panneau-droite { position: absolute; right: 80px; width: 860px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.carte-creme { background: var(--creme); border-radius: 24px; box-shadow: var(--ombre); padding: 28px 40px; text-align: center; }
.bouton-principal {
  display: inline-flex; align-items: center; justify-content: center; gap: 18px;
  min-width: 340px; height: 100px; padding: 0 48px; border-radius: 50px;
  background: var(--bleu) !important; color: #fff !important; font: 700 44px/1 var(--titre) !important;
  box-shadow: 0 7px 0 #1b4a8a, var(--ombre); transition: transform .15s, opacity .3s;
}
.bouton-principal:hover:not(:disabled) { transform: scale(1.05); }
.bouton-principal:disabled { opacity: .4; cursor: default !important; }
.bouton-principal kbd { font: 900 20px/1 var(--texte); padding: 7px 12px; border-radius: 8px; background: rgba(255, 255, 255, .22); }

/* Accueil */
#ecran-accueil .panneau-droite { top: 56px; }
#journee { padding: 8px 24px; border-radius: 999px; background: var(--ambre); font: 700 32px/1 var(--titre); box-shadow: var(--ombre); }
.logo { font: 700 120px/.98 var(--titre); color: var(--encre); text-align: center; text-shadow: 0 7px 0 var(--ambre); letter-spacing: -.01em; -webkit-text-stroke: 16px var(--creme); paint-order: stroke fill; }
.logo span { display: block; }
#accueil-carte { width: 860px; }
#accueil-accroche { font: 900 34px/1.25 var(--texte); }
#accueil-groupe { margin-top: 12px; font: 750 28px/1.3 var(--texte); }

.actions { display: flex; justify-content: flex-end; margin-top: 28px; }
#btn-continuer { height: 84px; font-size: 34px !important; }

#post { position: absolute; left: 80px; top: 50%; width: 680px; transform: translateY(-50%); border-radius: 26px; background: #fff; box-shadow: 0 18px 44px rgba(32, 39, 68, .3); overflow: hidden; }

/* Pause */

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   1. OUTILS ET RÉGLAGES FIXES
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const doux = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const rebond = (t) => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }; // dépasse un peu puis revient
const hasard = (a, b) => a + Math.random() * (b - a);
const choisir = (liste) => liste[Math.floor(Math.random() * liste.length)];
function melanger(liste) {
  const l = liste.slice();
  for (let i = l.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; }
  return l;
}
const typo = (s) => String(s).replace(/ ([?!:;»])/g, ' $1').replace(/« /g, '« ');

const C = CONFIG.couleurs, D = CONFIG.durees, T = CONFIG.textes;
const NB = CONFIG.questions.length;
const POLICE_TITRE = '"Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
const POLICE_TEXTE = '"Nunito", "Segoe UI", Arial, sans-serif';
const ECHELLE_PERSO = 0.88;

const REPONSES = [
  { lettre: 'A', couleur: C.bleu,   texte: '#FFFFFF', forme: 'cercle' },
  { lettre: 'B', couleur: C.ambre,  texte: C.encre,   forme: 'carre' },
  { lettre: 'C', couleur: C.menthe, texte: C.encre,   forme: 'triangle' },
  { lettre: 'D', couleur: C.prune,  texte: '#FFFFFF', forme: 'losange' }
];
const varsCss = { '--bleu-pastel': C.bleuPastel, '--creme': C.creme, '--vert': C.vert, '--sable': C.sable, '--bleu': C.bleu,
  '--ambre': C.ambre, '--menthe': C.menthe, '--prune': C.prune, '--encre': C.encre, '--rouge': C.rouge };
for (const [k, v] of Object.entries(varsCss)) document.documentElement.style.setProperty(k, v);

function svgForme(forme, couleur, taille) {
  const formes = {
    cercle: '<circle cx="12" cy="12" r="9.5"/>',
    carre: '<rect x="3" y="3" width="18" height="18" rx="1.5"/>',
    triangle: '<polygon points="12,2.5 22.5,21 1.5,21"/>',
    losange: '<polygon points="12,1 23,12 12,23 1,12"/>'
  };
  return `<svg viewBox="0 0 24 24" width="${taille}" height="${taille}" fill="${couleur}" aria-hidden="true">${formes[forme]}</svg>`;
}
function pastilleReponse(c) {
  const l = REPONSES[c];
  return `<span class="pastille-couloir" style="background:${l.couleur};color:${l.texte}">${l.lettre}${svgForme(l.forme, l.texte, 26)}</span>`;
}
const ICONES = {
  pleinEcran: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  quitterPleinEcran: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  son: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  muet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  publication: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h3l7 4V6L6 10H3zm13-1.5v7a4 4 0 0 0 0-7zM16 4v2.1a7 7 0 0 1 0 11.8V20a9 9 0 0 0 0-16z"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l1.5-2h5L16 5h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4zm4 3.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9zm-.4-2.2L19.8 2.5l.6 2.3L3.2 9.1zM6.5 5.9l2.6 2.3 1.9-.5-2.6-2.3zm5.3-1.3 2.6 2.3 1.9-.5-2.6-2.3z"/></svg>',
  etincelle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 11l-6.8 2.4L12 20l-2.2-6.6L3 11l6.8-2.4z"/></svg>'
};

function verifierConfig() {
  const erreurs = [];
  const effets = ['lumieres', 'persona', 'appel', 'sujet', 'decor', 'ambiance', 'cadrage', 'orbite'];
  if (!Array.isArray(CONFIG.questions) || NB === 0) erreurs.push('Aucune question dans CONFIG.');
  CONFIG.questions.forEach((q, i) => {
    if (!q.question) erreurs.push(`Étape ${i + 1} : le texte de la question est vide.`);
    if (!Array.isArray(q.reponses) || q.reponses.length !== 4) erreurs.push(`Étape ${i + 1} : il faut exactement 4 réponses.`);
    if (![1, 2, 3, 4].includes(q.bonne)) erreurs.push(`Étape ${i + 1} : « bonne » doit valoir 1, 2, 3 ou 4.`);
    if (q.effet && !effets.includes(q.effet)) erreurs.push(`Étape ${i + 1} : effet « ${q.effet} » inconnu.`);
  });
  return erreurs;
}

/* =====================================================================
   2. SONS (générés par le code, sans fichier audio)
   ===================================================================== */
function lireMuet() { try { return localStorage.getItem('studioIA.muet') === '1'; } catch (e) { return false; } }
function ecrireMuet(v) { try { localStorage.setItem('studioIA.muet', v ? '1' : '0'); } catch (e) { /* stockage indisponible */ } }

const Son = {
  ctx: null, maitre: null, bruitBuffer: null, muet: lireMuet(),
  init() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.maitre = this.ctx.createGain();
        this.maitre.gain.value = this.muet ? 0 : CONFIG.volume;
        this.maitre.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { /* pas de son, le jeu continue */ }
  },
  note(freq, debut, duree, type = 'sine', vol = 0.4, freqFin = null) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime + debut;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (freqFin) o.frequency.exponentialRampToValueAtTime(freqFin, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g).connect(this.maitre);
    o.start(t0); o.stop(t0 + duree + 0.05);
  },
  souffle(duree, f0, f1, vol, debut = 0, type = 'bandpass') {
    if (!this.ctx) return;
    if (!this.bruitBuffer) {
      const n = this.ctx.sampleRate * 0.5;
      this.bruitBuffer = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.bruitBuffer.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = this.ctx.currentTime + debut;
    const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    src.buffer = this.bruitBuffer; src.loop = true;
    f.type = type; f.Q.value = 1.4;
    f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + duree);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    src.connect(f).connect(g).connect(this.maitre);
    src.start(t0); src.stop(t0 + duree + 0.05);
  },
  clic()      { this.note(600, 0, 0.03, 'sine', 0.25); },

/* ---------- Fabriques de matériaux et de formes ---------- */
const cacheMateriaux = new Map();
function mat(couleur) {
  if (!cacheMateriaux.has(couleur)) cacheMateriaux.set(couleur, new THREE.MeshLambertMaterial({ color: couleur, flatShading: true }));
  return cacheMateriaux.get(couleur);
}
function maille(geo, couleur, x = 0, y = 0, z = 0, ombre = true) {
  const m = new THREE.Mesh(geo, typeof couleur === 'string' ? mat(couleur) : couleur);
  m.position.set(x, y, z);
  m.castShadow = ombre; m.receiveShadow = true;
  return m;
}
function textureCanvas(l, h, dessiner) {
  const c = document.createElement('canvas'); c.width = l; c.height = h;
  dessiner(c.getContext('2d'), l, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = ANISO;
  t.userData.canvas = c; t.userData.dessin = dessiner;
  return t;
}
function redessiner(t, dessiner) { const c = t.userData.canvas; const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); dessiner(ctx, c.width, c.height); t.needsUpdate = true; }
function rectangleArrondi(ctx, x, y, l, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + l - r, y); ctx.quadraticCurveTo(x + l, y, x + l, y + r);
  ctx.lineTo(x + l, y + h - r); ctx.quadraticCurveTo(x + l, y + h, x + l - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function lignesTexte(ctx, texte, largeurMax) {
  const mots = String(texte).split(/ +/), lignes = []; let ligne = '';
  for (const mot of mots) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (ctx.measureText(essai).width <= largeurMax) ligne = essai; else { if (ligne) lignes.push(ligne); ligne = mot; }
  }
  if (ligne) lignes.push(ligne);
  return lignes;
}
// Fait apparaître un objet avec un petit rebond (après un délai éventuel)
const anims = [];
function apparaitre(obj, delai = 0, duree = 0.55) {
  const e = obj.userData.echelle || 1;
  obj.visible = true; obj.scale.setScalar(0.0001);
  anims.push({ t: -delai, duree, maj: (k) => obj.scale.setScalar(Math.max(0.0001, e * rebond(k))) });
}
function animer(duree, maj, delai = 0) { anims.push({ t: -delai, duree, maj }); }
function plusTard(delai, action) { let fait = false; anims.push({ t: -delai, duree: 0.001, maj: () => { if (!fait) { fait = true; action(); } } }); } // délai en temps de jeu (respecte la pause)
function mettreAJourAnims(dt) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i]; a.t += dt;
    if (a.t < 0) continue;
    const k = clamp(a.t / a.duree, 0, 1);
    a.maj(k);
    if (k >= 1) anims.splice(i, 1);
  }
}

  const ajoute = (parent, geo, materiau, x, y, z) => { const me = new THREE.Mesh(geo, materiau); me.position.set(x, y, z); me.castShadow = true; parent.add(me); return me; };

    ajoute(hanche, B(0.17, 0.32, 0.19), m.pantalon, 0, -0.16, 0);
    const genou = new THREE.Group(); genou.position.y = -0.32; hanche.add(genou);

    ajoute(genou, B(0.19, 0.09, 0.30), m.pantalon, 0, -0.305, -0.045);
    ajoute(genou, B(0.20, 0.035, 0.31), m.semelle, 0, -0.3675, -0.045);
    return { hanche, genou };
  });
  ajoute(corps, B(0.40, 0.20, 0.24), m.pantalon, 0, 0.74, 0);
  ajoute(corps, B(0.42, 0.46, 0.25), m.tshirt, 0, 1.06, 0);
  ajoute(corps, B(0.30, 0.30, 0.03), m.tablier, 0, 1.07, -0.135);
  [-1, 1].forEach((s) => ajoute(corps, B(0.045, 0.2, 0.03), m.tablier, 0.12 * s, 1.25, -0.13));
  const jupe = new THREE.Group(); jupe.position.set(0, 0.88, -0.14); corps.add(jupe);
  ajoute(jupe, B(0.44, 0.40, 0.03), m.tablier, 0, -0.2, 0);
  ajoute(jupe, B(0.18, 0.12, 0.02), m.poche, 0, -0.17, -0.022);
  [-1, 1].forEach((s) => { const b = ajoute(corps, B(0.05, 0.56, 0.02), m.tablier, 0, 1.06, 0.135); b.rotation.z = 0.62 * s; });
  ajoute(corps, B(0.43, 0.05, 0.02), m.tablier, 0, 0.86, 0.135);
  const bras = [-1, 1].map((s) => {
    const epaule = new THREE.Group(); epaule.position.set(0.28 * s, 1.25, 0); corps.add(epaule);

    ajoute(epaule, new THREE.IcosahedronGeometry(0.075, 0), m.peau, 0, -0.5, 0);

  ajoute(corps, new THREE.CylinderGeometry(0.07, 0.08, 0.1, 6), m.peau, 0, 1.33, 0);
  const tete = new THREE.Group(); tete.position.y = 1.56; corps.add(tete);

  ajoute(tete, new THREE.IcosahedronGeometry(0.235, 0), m.cheveux, 0, 0.03, 0.075);
  [-1, 1].forEach((s) => ajoute(tete, new THREE.IcosahedronGeometry(0.032, 0), m.noir, 0.085 * s, 0.02, -0.222));
  const sourire = ajoute(tete, new THREE.TorusGeometry(0.06, 0.013, 4, 8, Math.PI), m.noir, 0, -0.06, -0.215);

/* ---------- Confettis ---------- */
const NB_CONFETTIS = 160;
const confettis = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.09, 0.055), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), NB_CONFETTIS);
confettis.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
confettis.frustumCulled = false;
const COULEURS_CONFETTIS = [C.bleu, C.ambre, C.menthe, C.prune, C.vert, C.creme];
const dataConfettis = [];
const tmpObjet = new THREE.Object3D(), tmpCouleur = new THREE.Color();
for (let i = 0; i < NB_CONFETTIS; i++) {
  dataConfettis.push({ vie: 0, p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), vr: new THREE.Vector3() });
  confettis.setColorAt(i, tmpCouleur.set(COULEURS_CONFETTIS[i % COULEURS_CONFETTIS.length]));
  tmpObjet.scale.setScalar(0); tmpObjet.updateMatrix(); confettis.setMatrixAt(i, tmpObjet.matrix);
}
scene.add(confettis);
let pluieConfettis = false, reservePluie = 0;
function lancerConfetti(p, v, vie) {
  const c = dataConfettis.find((d) => d.vie <= 0);
  if (!c) return;
  c.vie = vie; c.p.copy(p); c.v.copy(v);
  c.r.set(hasard(0, 6), hasard(0, 6), hasard(0, 6)); c.vr.set(hasard(-9, 9), hasard(-9, 9), hasard(-9, 9));
}
function explosionConfettis(x, y, z, n, force = 1) {
  const p = new THREE.Vector3(x, y, z);
  for (let i = 0; i < n; i++) lancerConfetti(p, new THREE.Vector3(hasard(-2, 2) * force, hasard(2.5, 5) * force, hasard(-1, 2) * force), 1.6);
}
function mettreAJourConfettis(dt) {
  if (pluieConfettis) {
    reservePluie += dt * 18;
    while (reservePluie >= 1) { reservePluie -= 1; lancerConfetti(new THREE.Vector3(hasard(-3.5, 3.5), 4.5, hasard(-2, 2)), new THREE.Vector3(hasard(-0.3, 0.3), hasard(-1.2, -0.6), 0), 6); }
  }
  for (let i = 0; i < NB_CONFETTIS; i++) {
    const c = dataConfettis[i];
    if (c.vie > 0) {
      c.vie -= dt;
      c.v.y -= 5 * dt; c.v.multiplyScalar(1 - 1.6 * dt);
      if (c.v.y < -1.6) c.v.y = -1.6;
      c.p.addScaledVector(c.v, dt);
      c.r.x += c.vr.x * dt; c.r.y += c.vr.y * dt; c.r.z += c.vr.z * dt;
      tmpObjet.position.copy(c.p); tmpObjet.rotation.copy(c.r);
      tmpObjet.scale.setScalar(c.vie > 0 && c.p.y > 0 ? Math.min(1, c.vie * 3) : 0);
    } else tmpObjet.scale.setScalar(0);
    tmpObjet.updateMatrix(); confettis.setMatrixAt(i, tmpObjet.matrix);
  }
  confettis.instanceMatrix.needsUpdate = true;
}
function viderConfettis() { dataConfettis.forEach((c) => (c.vie = 0)); pluieConfettis = false; }

function redimensionner() {
  const l = window.innerWidth, h = window.innerHeight;
  renderer.setSize(l, h, false);
  camera.aspect = l / h;
  VUE.portrait = h > l;
  document.body.classList.toggle('portrait', VUE.portrait);
  const LU = VUE.portrait ? 1080 : 1920, HU = VUE.portrait ? Math.max(1920, Math.round(1080 * h / l)) : 1080;
  ui.style.width = LU + 'px'; ui.style.height = HU + 'px';
  const s = Math.min(l / LU, h / HU);
  ui.style.transform = `translate(${(l - LU * s) / 2}px, ${(h - HU * s) / 2}px) scale(${s})`;
}
window.addEventListener('resize', redimensionner);
redimensionner();

function textesPills() {
  el.pillEtape.textContent = `${T.etape} ${Math.min(etat.index + 1, NB)} / ${NB}`;
  el.pillScore.textContent = `${T.score} ${etat.score} / ${NB}`;
}
function remplirQuestion() {
  const q = CONFIG.questions[etat.index];
  el.theme.className = q.theme;
  el.theme.innerHTML = `${ICONES[q.theme] || ''}${typo(T.themes[q.theme] || q.theme)}`;
  el.texteQuestion.textContent = typo(q.question);
  etat.ordre.forEach((r, c) => {
    const carte = el.cartes[c], l = REPONSES[c];
    carte.style.setProperty('--c', l.couleur);
    carte.className = 'carte';
    const tete = carte.querySelector('.carte-tete');
    tete.style.background = l.couleur; tete.style.color = l.texte;
    tete.innerHTML = `${l.lettre}${svgForme(l.forme, l.texte, 30)}`;
    carte.querySelector('.carte-corps').textContent = typo(q.reponses[r]);
    carte.querySelector('.badge').textContent = '';
    carte.setAttribute('aria-label', `Réponse ${l.lettre} : ${q.reponses[r]}`);
  });
}
function majSelection() {
  if (etat.phase === 'question') el.cartes.forEach((carte, c) => {
    carte.classList.toggle('actuelle', c === etat.selection);
    carte.querySelector('.badge').textContent = c === etat.selection ? T.etiquetteChoisie : '';
  });
  const actif = etat.phase === 'question' && etat.selection !== null;
  el.btnValider.disabled = !actif;
  el.btnValider.classList.toggle('invisible', etat.phase !== 'question');
}

/* =====================================================================
   9. DÉROULEMENT DU JEU
   ===================================================================== */
const etat = {
  phase: 'accueil', t: 0, index: 0, score: 0, resultats: [], ordre: [0, 1, 2, 3],
  selection: null, choix: null, ok: false, dernierTic: 99, phaseAvantPause: null, derniereAction: 0, effet: null
};
const PHASES_JEU = ['question', 'verdict', 'reponse', 'construction'];

function entrerPhase(phase) {
  etat.phase = phase; etat.t = 0;
  if (phase === 'explication') ouvrirExplication();
  if (phase === 'construction') commencerConstruction();
  if (phase === 'fin') ouvrirFin();
  majSelection();
}

function demarrerPartie() {
  Son.init(); Son.demarrage();
  Object.assign(etat, { score: 0, resultats: [] });
  reinitialiserStudio(); viderConfettis();
  CONFIG.questions.forEach((q, i) => { const c = $('case-' + i); c.classList.remove('remplie', 'flash'); c.querySelector('.val').textContent = '…'; });
  montrer(el.accueil, false); montrer(el.fin, false); montrer(el.explication, false);
  el.hud.classList.remove('masque');
  studio.plan = 'studio';
  perso.orientationCible = ORIENT_CAMERA;
  commencerQuestion(0);
}

function commencerQuestion(i) {
  etat.index = i; etat.selection = null; etat.choix = null;
  etat.ordre = melanger([0, 1, 2, 3]);
  remplirQuestion(); textesPills(); majBrief();
  el.progression.classList.toggle('sans-limite', !(CONFIG.tempsReponse > 0));
  el.progression.classList.remove('urgent'); el.barre.style.transform = 'scaleX(1)';
  etat.dernierTic = 99;
  entrerPhase('question');
  annoncer(`${T.etape} ${i + 1} : ${CONFIG.questions[i].question}`);
}

function choisirReponse(c) {
  if (etat.phase !== 'question' || c < 0 || c > 3) return;
  if (etat.selection === c && etat.derniereSelection && performance.now() - etat.derniereSelection > 350) { valider(); return; } // 2e clic sur la même carte = valider
  etat.selection = c; etat.derniereSelection = performance.now();
  Son.selection(); majSelection();
}
function deplacerSelection(sens) {
  if (etat.phase !== 'question') return;
  if (etat.selection === null) { etat.selection = sens > 0 ? 0 : 3; Son.selection(); majSelection(); return; }
  const c = etat.selection + sens;
  if (c < 0 || c > 3) { Son.bord(); return; }
  etat.selection = c; Son.selection(); majSelection();
}
function valider(tempsEcoule = false) {
  if (etat.phase !== 'question') return;
  if (etat.selection === null && !tempsEcoule) return;
  etat.choix = etat.selection;
  etat.tempsEcoule = tempsEcoule && etat.selection === null;
  if (etat.choix !== null) { el.cartes[etat.choix].classList.add('validee'); Son.valider(); }
  entrerPhase('verdict');
}
function reveler() {
  const q = CONFIG.questions[etat.index];
  const bonneCarte = etat.ordre.indexOf(q.bonne - 1);
  etat.ok = etat.choix === bonneCarte;
  etat.resultats[etat.index] = etat.ok;
  el.cartes.forEach((carte, c) => {
    carte.classList.remove('actuelle', 'validee');
    if (c === bonneCarte) { carte.classList.add('bonne'); carte.querySelector('.badge').textContent = '✓ ' + T.etiquetteBonne; }
    else if (c === etat.choix) { carte.classList.add('choisie'); carte.querySelector('.badge').textContent = '✗ ' + T.etiquetteChoisie; }
    else carte.classList.add('estompee');
  });
  el.retour.className = etat.ok ? 'ok' : 'ko';
  el.retourTitre.textContent = typo(etat.ok ? choisir(T.bravo) : etat.tempsEcoule ? T.tempsEcoule : choisir(T.rate));
  el.retourSous.textContent = typo(etat.ok ? T.bravoSousTitre : T.rateSousTitre);
  montrer(el.retour, true);
  if (etat.ok) {
    etat.score++; Son.bonne();
    perso.special = 'saut'; perso.tSpecial = 0;
    explosionConfettis(P.racine.position.x, 1.8, P.racine.position.z, 50);
  } else {
    Son.mauvaise(); perso.special = 'oups'; perso.tSpecial = 0;
  }
  textesPills(); majBrief();
  annoncer(etat.ok ? 'Bonne réponse !' : `La bonne réponse était : ${q.reponses[q.bonne - 1]}`);
  entrerPhase('reponse');
}

function ouvrirExplication() {
  const q = CONFIG.questions[etat.index];
  const bonneCarte = etat.ordre.indexOf(q.bonne - 1);
  montrer(el.retour, false);
  $('expl-titre').textContent = el.retourTitre.textContent;
  $('expl-etiquette-bonne').textContent = '✓ ' + T.etiquetteBonne;
  $('expl-pastille-bonne').innerHTML = pastilleReponse(bonneCarte);
  $('expl-bonne').textContent = typo(q.reponses[q.bonne - 1]);
  $('expl-etiquette-choisie').textContent = '✗ ' + T.etiquetteChoisie;
  if (etat.choix === null) { $('expl-pastille-choisie').innerHTML = ''; $('expl-choisie').textContent = T.pasDeReponse; }
  else { $('expl-pastille-choisie').innerHTML = pastilleReponse(etat.choix); $('expl-choisie').textContent = typo(q.reponses[etat.ordre[etat.choix]]); }
  $('expl-choisie').parentElement.classList.toggle('cache', etat.ok);
  $('expl-texte').textContent = typo(q.explication || '');
  el.btnContinuer.disabled = true;
  montrer(el.explication, true);
}
function fermerExplication() {
  if (etat.phase !== 'explication' || el.btnContinuer.disabled) return;
  montrer(el.explication, false); Son.clic();
  entrerPhase('construction');
}

function commencerConstruction() {
  montrer(el.retour, false);
  const q = CONFIG.questions[etat.index];
  remplirCase(etat.index);
  etat.effet = q.effet && EFFETS[q.effet] && !studio.construit[q.effet] ? EFFETS[q.effet] : null;
  etat.dureeConstruction = etat.effet ? etat.effet.duree() : 1.2;
  if (etat.effet) { etat.effet.reset && etat.effet.reset(); etat.effet.debut(); studio.construit[q.effet] = true; }
  if (q.annonceScene && etat.effet && !['cadrage', 'orbite'].includes(q.effet)) {
    el.annonceScene.innerHTML = `${ICONES.etincelle}${typo(q.annonceScene)}`;
    plusTard(0.15, () => { if (etat.phase === 'construction') montrer(el.annonceScene, true); });
  }
  perso.orientationCible = ORIENT_TABLE; perso.special = null;
}
function finirConstruction() {
  montrer(el.annonceScene, false);
  perso.orientationCible = ORIENT_CAMERA;
  if (etat.index + 1 < NB) commencerQuestion(etat.index + 1);
  else entrerPhase('fin');
}

function ouvrirFin() {
  // Tout ce qui n’a pas été construit (étapes retirées de CONFIG) l’est maintenant
  ['lumieres', 'persona', 'appel', 'sujet', 'decor', 'ambiance'].forEach((n) => { if (!studio.construit[n]) construireInstantane(n); });
  el.hud.classList.add('masque');
  studio.plan = 'fin';
  perso.orientationCible = Math.PI;
  const tiers = T.finTiers.slice().sort((a, b) => a.min - b.min).filter((x) => etat.score >= x.min);
  $('fin-titre').textContent = typo(T.finTitre);
  $('fin-score').textContent = `${etat.score} / ${NB}`;
  $('fin-points').innerHTML = etat.resultats.map((r, i) => `<span class="point ${r ? 'ok' : 'ko'}">${i + 1} ${r ? '✓' : '✗'}</span>`).join('');
  $('fin-message').textContent = typo(tiers.length ? tiers[tiers.length - 1].message : '');
  const morceaux = CONFIG.questions.filter((q) => q.theme === 'image').map((q) => q.brief).filter(Boolean);
  $('fin-prompt').innerHTML = `<b>${typo(T.finPrompt)}</b>« ${typo(morceaux.join(', '))}. »`;
  $('fin-prompt').classList.toggle('cache', !morceaux.length);
  if (!studio.photo) studio.demandeCaptureFin = true;
  else $('post-photo').src = studio.photo;
  montrer(el.fin, true);
  pluieConfettis = true;
  Son.fin();
  annoncer(`Score : ${etat.score} sur ${NB}. ${T.messageCle}`);
}

function basculerPause() {
  if (etat.phase === 'pause') {
    etat.phase = etat.phaseAvantPause; montrer(el.pause, false); Son.clic();
  } else if (etat.phase === 'question' || etat.phase === 'explication') {
    etat.phaseAvantPause = etat.phase; etat.phase = 'pause'; montrer(el.pause, true); Son.clic();
  }
}

/* ---------- Commandes ---------- */
function actionPrincipale() {
  const maintenant = performance.now();
  if (maintenant - etat.derniereAction < 300) return;
  etat.derniereAction = maintenant;
  if (etat.phase === 'accueil' && !el.btnJouer.disabled) demarrerPartie();
  else if (etat.phase === 'question') valider();
  else if (etat.phase === 'explication') fermerExplication();
  else if (etat.phase === 'fin' && etat.t > D.fonduFin) demarrerPartie();
  else if (etat.phase === 'pause') basculerPause();
}
function basculerPleinEcran() {
  if (!document.fullscreenElement) { const r = document.documentElement.requestFullscreen?.(); if (r) r.catch(() => {}); }
  else document.exitFullscreen?.();
}
window.addEventListener('keydown', (ev) => {
  Son.init();
  const k = ev.key.toLowerCase(), code = ev.code;
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'enter'].includes(k) || code === 'Space') ev.preventDefault();
  if (ev.repeat) return;
  if (k === 'arrowleft' || k === 'q' || code === 'KeyA') { deplacerSelection(-1); return; }
  if (k === 'arrowright' || k === 'd' || code === 'KeyD') { deplacerSelection(1); return; }
  if (/^(Digit|Numpad)[1-4]$/.test(code)) { if (etat.phase === 'question') { etat.selection = Number(code.slice(-1)) - 1; Son.selection(); majSelection(); } return; }
  if (code === 'Space' || k === ' ' || k === 'enter') { actionPrincipale(); return; }
  if (k === 'f') basculerPleinEcran();
  else if (k === 'm') { Son.basculer(); majBoutonSon(); }
  else if (k === 'escape' || k === 'p') basculerPause();
});
document.querySelectorAll('#ui button').forEach((b) => b.addEventListener('mousedown', (e) => e.preventDefault()));
el.btnJouer.addEventListener('click', () => { if (etat.phase === 'accueil') { etat.derniereAction = performance.now(); demarrerPartie(); } });
el.btnValider.addEventListener('click', () => { Son.init(); valider(); });
el.btnContinuer.addEventListener('click', fermerExplication);
el.btnRejouer.addEventListener('click', () => { if (etat.phase === 'fin') { etat.derniereAction = performance.now(); demarrerPartie(); } });
el.btnReprendre.addEventListener('click', () => { if (etat.phase === 'pause') basculerPause(); });
el.btnSon.addEventListener('click', () => { Son.init(); Son.basculer(); majBoutonSon(); Son.clic(); });
el.btnPleinEcran.addEventListener('click', () => { Son.init(); basculerPleinEcran(); });

/* =====================================================================
   10. ANIMATION IMAGE PAR IMAGE
   ===================================================================== */
function calculerPose(mode, t) {
  const p = { jambeG: 0, jambeD: 0, genouG: 0, genouD: 0, brasGx: 0, brasDx: 0, ecartG: 0.08, ecartD: 0.08, corpsY: 0, penche: 0, roulis: 0, teteY: 0, casquette: 0, casquetteRot: 0 };
  if (mode === 'attente') {                       // accueil : salue de la main
    p.corpsY = 0.012 + Math.sin(t * 4) * 0.012;
    p.brasDx = 2.75; p.ecartD = 0.25 + Math.sin(t * 7) * 0.35;
  } else if (mode === 'reflechit') {              // pendant la question : main au menton
    p.corpsY = 0.01 + Math.sin(t * 2.6) * 0.01;
    p.brasDx = 2.25; p.ecartD = -0.35; p.brasGx = 0.5; p.ecartG = -0.5;
    p.teteY = Math.sin(t * 1.3) * 0.25; p.roulis = Math.sin(t * 1.3) * 0.04;
  } else if (mode === 'pointe') {                 // construction : montre la table
    p.corpsY = 0.01; p.brasDx = 1.5; p.ecartD = -0.1; p.penche = -0.05;
  } else if (mode === 'arret') {
    p.corpsY = 0.01 + Math.sin(t * 3.9) * 0.01;
  } else if (mode === 'saut') {                   // bonne réponse : saut de joie
    const b = Math.sin(Math.PI * clamp(t / 0.5, 0, 1));
    p.corpsY = 0.5 / ECHELLE_PERSO * b;
    p.brasGx = 2.8; p.brasDx = 2.8; p.ecartG = 0.3; p.ecartD = 0.3;
    p.jambeG = 0.35 * b; p.genouG = -0.6 * b; p.genouD = -0.4 * b;
  } else if (mode === 'oups') {                   // mauvaise réponse : se gratte la tête
    const u = clamp(t / 1.1, 0, 1), b = Math.sin(Math.PI * u);
    p.brasDx = 2.7 * b; p.ecartD = (0.1 + Math.sin(t * 16) * 0.12) * b;
    p.teteY = Math.sin(t * 9) * 0.3 * b; p.roulis = 0.08 * b; p.corpsY = -0.02 * b;
  } else if (mode === 'fete') {
    const c = t % 2;
    if (c < 1) {
      const b = Math.sin(Math.PI * ((c % 0.5) / 0.5));
      p.corpsY = 0.35 * b; p.brasGx = 2.8; p.brasDx = 2.8; p.ecartG = 0.35; p.ecartD = 0.35; p.genouG = p.genouD = -0.4 * b;
    } else {
      p.brasDx = 2.9; p.ecartD = 0.15 + Math.sin(t * 10) * 0.25; p.casquette = 1; p.casquetteRot = Math.sin(t * 10) * 0.3; p.corpsY = 0.01;
    }
  }
  return p;
}
function mettreAJourPersonnage(dt) {
  perso.temps += dt;
  perso.orientation = lerp(perso.orientation, perso.orientationCible, 1 - Math.exp(-dt * 6));
  P.racine.rotation.y = perso.orientation;
  if (perso.special) { perso.tSpecial += dt; if (perso.tSpecial >= (perso.special === 'saut' ? 0.5 : 1.1)) perso.special = null; }
  let mode;
  if (perso.special) mode = perso.special;
  else if (etat.phase === 'accueil') mode = 'attente';
  else if (etat.phase === 'question' || etat.phase === 'verdict') mode = 'reflechit';
  else if (etat.phase === 'construction') mode = 'pointe';
  else if (etat.phase === 'fin') mode = 'fete';
  else mode = 'arret';
  const cible = calculerPose(mode, mode === perso.special ? perso.tSpecial : perso.temps);
  const k = 1 - Math.exp(-dt * 14);
  const p = perso.pose;
  for (const cle in cible) p[cle] = lerp(p[cle], cible[cle], k);
  P.jambes[0].hanche.rotation.x = p.jambeG; P.jambes[1].hanche.rotation.x = p.jambeD;
  P.jambes[0].genou.rotation.x = p.genouG;  P.jambes[1].genou.rotation.x = p.genouD;
  P.bras[0].rotation.x = p.brasGx; P.bras[0].rotation.z = -p.ecartG;
  P.bras[1].rotation.x = p.brasDx; P.bras[1].rotation.z = p.ecartD;
  P.jupe.rotation.x = Math.max(p.jambeG, p.jambeD, 0) * 0.6;
  P.corps.position.y = p.corpsY;
  P.corps.rotation.x = p.penche; P.corps.rotation.z = p.roulis;
  P.tete.rotation.y = p.teteY;
  P.casquette.position.set(p.casquette * 0.12, 0.1 + p.casquette * 0.32, 0);
  P.casquette.rotation.z = p.casquetteRot;
}

// Caméra : plans « accueil », « studio », « gros-plan », « orbite », « fin »
const camPos = new THREE.Vector3(1, 3, 8), camVise = new THREE.Vector3(0, 1.1, -0.5);
const vPos = new THREE.Vector3(), vVise = new THREE.Vector3();
let fovActuel = 42, decalX = 0, decalY = 0;
function planCamera(t) {
  const portrait = VUE.portrait, a = camera.aspect;
  let fov = 42, dx = 0, dy = 0;
  const bal = Math.sin(t * 0.25) * 0.25;   // léger balancement pour faire vivre la scène
  switch (studio.plan) {
    case 'accueil':
      vPos.set(0.4 + bal, 2.7, 7.4); vVise.set(-0.5, 1.25, -0.6);
      dx = portrait ? 0 : 0.17; dy = portrait ? -0.2 : 0;
      break;
    case 'gros-plan':
      vPos.set(0.78, HAUT_TABLE + 0.62, 1.6); vVise.set(0, HAUT_TABLE + 0.25, 0); fov = 32;
      break;
    case 'orbite': {
      const ang = 0.45 + doux(studio.orbite) * Math.PI * 2, r = 1.75;
      vPos.set(Math.sin(ang) * r, HAUT_TABLE + 0.6, Math.cos(ang) * r); vVise.set(0, HAUT_TABLE + 0.25, 0); fov = 34;
      break;
    }
    case 'fin':
      vPos.set(0.9 + bal, 2.6, 6.6); vVise.set(-0.3, 1.2, -0.6);
      dx = portrait ? 0 : 0.02; dy = portrait ? 0.02 : 0;
      break;
    default: // studio pendant les questions
      vPos.set(0.5 + bal * 0.6, 2.9, 7.6); vVise.set(-0.2, 1.15, -0.7);
      dx = portrait ? 0 : -0.1; dy = portrait ? 0.02 : 0.02;
  }
  if (portrait) {
    // Vertical : on recule et on élargit l’angle pour garder la table, l’artisan et les tableaux
    if (studio.plan === 'fin') vPos.z += 1.6;
    const hfov = studio.plan === 'gros-plan' || studio.plan === 'orbite' ? 34 : studio.plan === 'fin' ? 50 : studio.plan === 'accueil' ? 40 : 35;
    fov = clamp(THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(hfov / 2)) / a)), 40, 82);
  } else if (a < 1.6) {
    fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(fov / 2)) * 1.6 / a));
  }
  return { fov, dx, dy };
}
function mettreAJourCamera(dt, t) {
  const p = planCamera(t);
  const vitesse = studio.plan === 'orbite' ? 30 : studio.plan === 'gros-plan' ? 3.2 : 2.6;
  const k = 1 - Math.exp(-dt * vitesse);
  camPos.lerp(vPos, k); camVise.lerp(vVise, k);
  fovActuel = lerp(fovActuel, p.fov, k); decalX = lerp(decalX, p.dx, k); decalY = lerp(decalY, p.dy, k);
  camera.position.copy(camPos); camera.lookAt(camVise);
  camera.fov = fovActuel;
  const l = renderer.domElement.width, h = renderer.domElement.height;
  camera.setViewOffset(l, h, decalX * l, decalY * h, l, h);
  camera.updateProjectionMatrix();
}
function mettreAJourLumieres(dt, t) {
  lum.niveau = lerp(lum.niveau, lum.cible, 1 - Math.exp(-dt * 5));
  lum.chaud = lerp(lum.chaud, lum.chaudCible, 1 - Math.exp(-dt * 3));
  hemi.intensity = lerp(0.3, 1.15, lum.niveau);
  lampe.intensity = lerp(0.05, 2.1, lum.niveau);
  hemi.color.copy(COULEUR_FROIDE).lerp(COULEUR_CHAUDE, lum.chaud * 0.8);
  panneauxLumiere.forEach((m) => m.color.set('#555B74').lerp(tmpCouleur.set('#FFF8E8'), lum.niveau));
  const vacille = 1 + Math.sin(t * 13) * 0.08 + Math.sin(t * 29) * 0.05;
  flammeLumiere.intensity = lum.chaud * 2.6 * vacille * (flamme.visible ? 1 : 0);
  if (flamme.visible) { flamme.children[0].scale.set(1, vacille, 1); flamme.rotation.z = Math.sin(t * 7) * 0.06; }
  bokeh.forEach((b) => {
    b.material.opacity = lum.chaud * b.userData.op * (0.75 + 0.25 * Math.sin(t * 1.5 + b.userData.ph));
    b.position.y = b.userData.base.y + Math.sin(t * 0.6 + b.userData.ph) * 0.05;
    b.lookAt(camera.position);
  });
  pointQuestion.position.y = HAUT_TABLE + 0.45 + Math.sin(t * 2.2) * 0.05;
}

function mettreAJour(dt) {
  if (etat.phase === 'pause') return;
  etat.t += dt;
  const p = etat.phase;
  if (p === 'question' && CONFIG.tempsReponse > 0) {
    const restant = CONFIG.tempsReponse - etat.t;
    el.barre.style.transform = `scaleX(${clamp(restant / CONFIG.tempsReponse, 0, 1)})`;
    const urgent = restant <= CONFIG.alerteFin;
    el.progression.classList.toggle('urgent', urgent);
    if (urgent && restant > 0) { const s = Math.ceil(restant); if (s !== etat.dernierTic) { etat.dernierTic = s; Son.tic(); } }
    if (restant <= 0) valider(true);
  } else if (p === 'verdict') {
    if (etat.t >= D.suspense) reveler();
  } else if (p === 'reponse') {
    if (etat.t >= D.reponse) {
      if (etat.ok && !CONFIG.explicationSiBonneReponse) entrerPhase('construction');
      else entrerPhase('explication');
    }
  } else if (p === 'explication') {
    if (etat.t >= D.explicationMin && el.btnContinuer.disabled) el.btnContinuer.disabled = false;
  } else if (p === 'construction') {
    if (etat.effet && etat.effet.maj) etat.effet.maj(etat.t);
    if (etat.t >= etat.dureeConstruction) finirConstruction();
  }
}

let dernierTemps = performance.now();
function boucle(maintenant) {
  requestAnimationFrame(boucle);
  const dt = Math.min((maintenant - dernierTemps) / 1000, 0.05);
  dernierTemps = maintenant;
  pas(dt, maintenant / 1000);
}
function pas(dt, t, rendu = true) {
  mettreAJour(dt);
  if (etat.phase !== 'pause') {
    mettreAJourAnims(dt);
    mettreAJourPersonnage(dt);
    mettreAJourConfettis(dt);
  }
  mettreAJourLumieres(dt, t);
  mettreAJourCamera(dt, t);
  if (!rendu && !studio.demandeCapture && !studio.demandeCaptureFin) return;
  renderer.render(scene, camera);
  // La « photo » est prise juste après le rendu (sinon l’image serait vide)
  if (studio.demandeCapture) {
    studio.demandeCapture = false;
    try { studio.photo = renderer.domElement.toDataURL('image/jpeg', 0.9); } catch (e) { /* capture impossible */ }
  }
  if (studio.demandeCaptureFin) {
    studio.demandeCaptureFin = false;
    try { studio.photo = renderer.domElement.toDataURL('image/jpeg', 0.9); $('post-photo').src = studio.photo; } catch (e) { /* capture impossible */ }
  }
}

// Redessine les textures avec les bonnes polices une fois chargées
if (document.fonts) {
  Promise.all([document.fonts.load('700 100px Fredoka'), document.fonts.load('900 60px Nunito')]).catch(() => {}).then(() => {
    [texPersona, ...texturesAvecTexte].forEach((t) => redessiner(t, t.userData.dessin));
    if (etat.phase === 'accueil') studioAccueil();
  });
}

studioAccueil();
camPos.set(0.4, 2.7, 7.4); camVise.set(-0.5, 1.25, -0.6);
window.__studioIAPret = true;
// Accès de test (sans effet sur la partie)
let tempsTest = 0;
window.__studioTest = { etat, studio, EFFETS, demarrerPartie, commencerQuestion, choisirReponse, valider, entrerPhase, construireInstantane,
  avancer(sec) { const n = Math.round(sec * 30); for (let i = 0; i < n; i++) { tempsTest += 1 / 30; pas(1 / 30, tempsTest, i === n - 1); } } };
requestAnimationFrame(boucle);
</script>

<script>
  setTimeout(function () { if (!window.__studioIAPret) document.getElementById('erreur').style.display = 'flex'; }, 8000);
</script>
